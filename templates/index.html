<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Display Control Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: rgba(59, 130, 246, 0.1);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.08);
            --shadow-glass: 0 8px 32px rgba(59, 130, 246, 0.1);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-primary);
            background-image: 
                radial-gradient(ellipse at top, rgba(59, 130, 246, 0.05), transparent),
                radial-gradient(ellipse at bottom, rgba(139, 92, 246, 0.05), transparent);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(59, 130, 246, 0.02) 0px,
                    transparent 1px,
                    transparent 2px,
                    rgba(59, 130, 246, 0.02) 3px
                );
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2), transparent);
            border-radius: 50%;
            filter: blur(40px);
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.8; transform: translateX(-50%) scale(1.2); }
        }

        .header h1 {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            position: relative;
        }

        .header p {
            font-size: 1.1em;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 32px;
            margin-bottom: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card h2 {
            font-size: 1.6em;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 2px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .status-item {
            padding: 24px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(139, 92, 246, 0.05));
            border: 1px solid rgba(59, 130, 246, 0.1);
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .status-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            transition: left 0.5s;
        }

        .status-item:hover::before {
            left: 100%;
        }

        .status-item:hover {
            transform: scale(1.02);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .status-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .status-value {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-unit {
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 10px;
            color: var(--text-primary);
            font-size: 0.95em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1em;
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: var(--bg-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.05);
            border-color: var(--accent-primary);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: all 0.3s;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .carousel-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .carousel-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.1);
            border-radius: 8px;
            transition: all 0.3s;
        }

        .carousel-item:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .carousel-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: var(--accent-primary);
        }

        .message {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
            backdrop-filter: blur(10px);
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .refresh-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-primary);
            margin-right: 8px;
            animation: pulse-glow 2s infinite;
            box-shadow: 0 0 6px var(--accent-primary);
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-primary);
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .checkmark {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-right: 3px solid var(--accent-primary);
            border-bottom: 3px solid var(--accent-primary);
            transform: rotate(45deg);
            animation: checkmark 0.4s ease-in-out;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes checkmark {
            0% { transform: scale(0) rotate(45deg); }
            50% { transform: scale(1.2) rotate(45deg); }
            100% { transform: scale(1) rotate(45deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-value {
            animation: fadeIn 0.5s ease-in-out;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2em;
            }
            
            .status-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Weather Display Control Center</h1>
            <p>Advanced Monitoring & Configuration System</p>
        </div>

        <div id="message" class="message"></div>

        <!-- Current Status -->
        <div class="card">
            <h2><span class="refresh-indicator"></span>System Status</h2>
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-label">Temperature</div>
                    <div class="status-value" id="temperature">--</div>
                    <div class="status-unit">°C</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Humidity</div>
                    <div class="status-value" id="humidity">--</div>
                    <div class="status-unit">%</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Weather</div>
                    <div class="status-value" id="weather" style="font-size: 1.2em;">--</div>
                </div>
                <div class="status-item">
                    <div class="status-label">System Status</div>
                    <div class="status-value" id="running" style="font-size: 1.2em;">--</div>
                </div>
            </div>
            <p style="text-align: center; color: var(--text-secondary); font-size: 0.9em; margin-top: 16px;">
                Last Updated: <span id="lastUpdate">--</span>
            </p>
        </div>

        <!-- Display Settings -->
        <div class="card">
            <h2>Display Settings</h2>
            
            <div class="form-group">
                <label for="displayMode">Display Mode</label>
                <select id="displayMode">
                    <option value="carousel">Carousel (Rotate through all pages)</option>
                    <option value="icon">Icon Only</option>
                    <option value="scrolling">Scrolling Text</option>
                    <option value="mixed">Mixed (Icon + Text)</option>
                    <option value="alert">Alert Mode</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pageDuration">Page Duration (seconds)</label>
                <div class="slider-container">
                    <input type="range" id="pageDuration" class="slider" min="5" max="120" value="20">
                    <span id="pageDurationValue">20s</span>
                </div>
            </div>

            <div class="form-group">
                <label for="brightness">Display Brightness</label>
                <div class="slider-container">
                    <input type="range" id="brightness" class="slider" min="0" max="255" value="255">
                    <span id="brightnessValue">255</span>
                </div>
            </div>

            <div class="form-group">
                <label>Carousel Items (select what to display)</label>
                <div class="carousel-items">
                    <label class="carousel-item">
                        <input type="checkbox" name="carousel" value="temperature_bars" checked>
                        Temperature Bars
                    </label>
                    <label class="carousel-item">
                        <input type="checkbox" name="carousel" value="weather_icon" checked>
                        Weather Icon
                    </label>
                    <label class="carousel-item">
                        <input type="checkbox" name="carousel" value="temperature_display" checked>
                        Temperature Display
                    </label>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="saveDisplaySettings()">Save Display Settings</button>
            </div>
        </div>

        <!-- Update Intervals -->
        <div class="card">
            <h2>Update Intervals</h2>
            
            <div class="form-group">
                <label for="weatherInterval">Weather Update (minutes)</label>
                <input type="number" id="weatherInterval" min="5" max="120" value="30">
            </div>

            <div class="form-group">
                <label for="earthquakeInterval">Earthquake Check (minutes)</label>
                <input type="number" id="earthquakeInterval" min="1" max="60" value="5">
            </div>

            <div class="form-group">
                <label for="observationInterval">Observation Update (minutes)</label>
                <input type="number" id="observationInterval" min="5" max="60" value="10">
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="saveIntervals()">Save Intervals</button>
                <button class="btn btn-secondary" onclick="forceUpdate('weather')">Force Weather Update</button>
                <button class="btn btn-secondary" onclick="forceUpdate('earthquake')">Force Earthquake Check</button>
            </div>
        </div>
    </div>

    <script>
        // Auto-refresh status every 5 seconds
        let refreshInterval;

        function showMessage(message, type = 'success') {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = message;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 3000);
        }

        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                // Update status display
                document.getElementById('temperature').textContent = 
                    data.current_status.temperature?.toFixed(1) || '--';
                document.getElementById('humidity').textContent = 
                    data.current_status.humidity || '--';
                document.getElementById('weather').textContent = 
                    data.current_status.weather || '--';
                document.getElementById('running').textContent = 
                    data.current_status.running ? '✅ Running' : '❌ Stopped';
                document.getElementById('lastUpdate').textContent = 
                    new Date(data.timestamp).toLocaleString('zh-TW');
                
                // Update form values
                document.getElementById('displayMode').value = data.display_settings.mode || 'carousel';
                document.getElementById('pageDuration').value = data.display_settings.page_duration || 20;
                document.getElementById('pageDurationValue').textContent = (data.display_settings.page_duration || 20) + 's';
                document.getElementById('brightness').value = data.display_settings.brightness || 255;
                document.getElementById('brightnessValue').textContent = data.display_settings.brightness || 255;
                
                // Update carousel checkboxes
                const carouselItems = data.display_settings.carousel_items || ['temperature_bars', 'weather_icon', 'temperature_display'];
                document.querySelectorAll('input[name="carousel"]').forEach(cb => {
                    cb.checked = carouselItems.includes(cb.value);
                });
                
                document.getElementById('weatherInterval').value = (data.update_intervals.weather || 1800) / 60;
                document.getElementById('earthquakeInterval').value = (data.update_intervals.earthquake || 300) / 60;
                document.getElementById('observationInterval').value = (data.update_intervals.observation || 600) / 60;
            } catch (error) {
                console.error('Error loading status:', error);
            }
        }

        async function saveDisplaySettings() {
            const button = event.target;
            const originalText = button.innerHTML;
            
            // Show loading state
            button.disabled = true;
            button.innerHTML = 'Saving... <span class="spinner"></span>';
            
            const carouselItems = Array.from(document.querySelectorAll('input[name="carousel"]:checked'))
                .map(cb => cb.value);
            
            const settings = {
                display_settings: {
                    mode: document.getElementById('displayMode').value,
                    page_duration: parseFloat(document.getElementById('pageDuration').value),
                    brightness: parseInt(document.getElementById('brightness').value),
                    carousel_items: carouselItems
                }
            };

            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings)
                });
                const result = await response.json();
                
                if (result.success) {
                    button.innerHTML = 'Saved! <span class="checkmark"></span>';
                    setTimeout(() => {
                        button.innerHTML = originalText;
                        button.disabled = false;
                    }, 2000);
                } else {
                    button.innerHTML = originalText;
                    button.disabled = false;
                }
                
                showMessage(result.message, result.success ? 'success' : 'error');
            } catch (error) {
                button.innerHTML = originalText;
                button.disabled = false;
                showMessage('Error saving settings: ' + error.message, 'error');
            }
        }

        async function saveIntervals() {
            const button = event.target;
            const originalText = button.innerHTML;
            
            // Show loading state
            button.disabled = true;
            button.innerHTML = 'Saving... <span class="spinner"></span>';
            
            const intervals = {
                update_intervals: {
                    weather: parseInt(document.getElementById('weatherInterval').value) * 60,
                    earthquake: parseInt(document.getElementById('earthquakeInterval').value) * 60,
                    observation: parseInt(document.getElementById('observationInterval').value) * 60
                }
            };

            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(intervals)
                });
                const result = await response.json();
                
                if (result.success) {
                    button.innerHTML = 'Saved! <span class="checkmark"></span>';
                    setTimeout(() => {
                        button.innerHTML = originalText;
                        button.disabled = false;
                    }, 2000);
                } else {
                    button.innerHTML = originalText;
                    button.disabled = false;
                }
                
                showMessage(result.message, result.success ? 'success' : 'error');
            } catch (error) {
                button.innerHTML = originalText;
                button.disabled = false;
                showMessage('Error saving intervals: ' + error.message, 'error');
            }
        }

        async function forceUpdate(type) {
            const button = event.target;
            const originalText = button.innerHTML;
            
            // Show loading state
            button.disabled = true;
            button.innerHTML = 'Updating... <span class="spinner"></span>';
            
            try {
                const response = await fetch('/api/force_update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type })
                });
                const result = await response.json();
                
                if (result.success) {
                    button.innerHTML = 'Updated! <span class="checkmark"></span>';
                    setTimeout(() => {
                        button.innerHTML = originalText;
                        button.disabled = false;
                        loadStatus();
                    }, 2000);
                } else {
                    button.innerHTML = originalText;
                    button.disabled = false;
                }
                
                showMessage(result.message, result.success ? 'success' : 'error');
            } catch (error) {
                button.innerHTML = originalText;
                button.disabled = false;
                showMessage('Error triggering update: ' + error.message, 'error');
            }
        }

        // Update slider value displays
        document.getElementById('pageDuration').addEventListener('input', function() {
            document.getElementById('pageDurationValue').textContent = this.value + 's';
        });

        document.getElementById('brightness').addEventListener('input', function() {
            document.getElementById('brightnessValue').textContent = this.value;
        });

        // Initialize
        loadStatus();
        refreshInterval = setInterval(loadStatus, 5000);
    </script>
</body>
</html>
